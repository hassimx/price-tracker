<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Price Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">Price Tracker</a>
      <span class="tagline">Book prices from books.toscrape.com</span>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Data comes from <a href="https://books.toscrape.com">books.toscrape.com</a>, a practice site for scrapers.</p>
      {% if has_demo %}
      <p>The price history shown here is generated demo data, not real price changes.</p>
      {% endif %}
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
